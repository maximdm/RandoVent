name: CI

on:
  push:
    branches: [main, feature/m9-stats]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      # Lightweight native-config sanity checks (no Android SDK required):
      # - expo config resolves app.json / app.config and the Expo project.
      # - expo install --check verifies installed deps match the Expo SDK.
      - run: npx expo config --type public
      - run: npx expo install --check
